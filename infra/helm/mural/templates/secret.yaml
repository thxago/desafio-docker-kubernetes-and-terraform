{{- if not .Values.postgres.existingSecret }}
{{- $password := required "Provide postgres.password privately or set postgres.existingSecret" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.secretName" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  database-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" (.Values.postgres.username | urlquery | replace "+" "%20") ($password | urlquery | replace "+" "%20") (include "mural.fullname" .) (.Values.postgres.database | urlquery | replace "+" "%20") | quote }}
{{- end }}
