apiVersion: v1
kind: Service
metadata:
  name: {{ include "mural.fullname" . }}-api
  labels:
    {{- include "mural.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mural.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mural.fullname" . }}-api
  labels:
    {{- include "mural.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mural.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mural.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        mural/migration-revision: {{ .Release.Revision | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-migrations
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            {{- include "mural.databaseEnv" . | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              until [ "$(psql --no-password --tuples-only --no-align --command="SELECT revision FROM mural_infra_migrations WHERE release_name = '{{ .Release.Name }}';" 2>/dev/null || true)" = "{{ .Release.Revision }}" ]; do
                sleep 2
              done
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mural.fullname" . }}-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mural.secretName" . }}
                  key: database-url
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
