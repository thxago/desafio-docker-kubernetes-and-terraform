apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mural.fullname" . }}-config
  labels:
    {{- include "mural.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  API_UPSTREAM: {{ printf "%s-api:%v" (include "mural.fullname" .) .Values.api.service.port | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  PGHOST: {{ printf "%s-postgres" (include "mural.fullname" .) | quote }}
  PGPORT: "5432"
