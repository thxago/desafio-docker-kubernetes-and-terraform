name: mural-compose

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mural}
      POSTGRES_DB: ${POSTGRES_DB:-mural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the local .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-mural}
      PGDATABASE: ${POSTGRES_DB:-mural}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the local .env file}
      LC_ALL: C
    volumes:
      - ./app/api/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for migration in /migrations/*.sql; do
          if [ ! -f "$$migration" ]; then
            echo "No SQL migrations found" >&2
            exit 1
          fi
          echo "Applying $${migration##*/}"
          psql --no-password --set=ON_ERROR_STOP=1 --single-transaction --file="$$migration"
        done

  api:
    image: golang:1.23-alpine
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mural}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the local .env file}@db:5432/${POSTGRES_DB:-mural}?sslmode=disable
      PORT: "8080"
    volumes:
      - ./app/api:/app:ro
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["go", "run", "-mod=readonly", "."]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$$PORT/readyz\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 180s

  web:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8080
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    volumes:
      - ./app/web:/usr/share/nginx/html:ro
      - ./app/web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  go-modules:
  go-build:
